experiment:
  name: "art-e-3model-comparison"
  seed: 42
  num_samples: 350
  max_turns: 10
  output_dir: "outputs/eval"

dataset:
  path: "data/art_e_vince_kaminski"
  split: "test"
  db_path: "data/enron_emails.db"

judge:
  model: "gpt-5-mini"
  api_key_env: "OPENAI_API_KEY"

models:
  - name: "ministral-14b"
    backend: "openai"
    model_name: "mistralai/Ministral-3-14B-Instruct-2512-BF16"
    base_url: "http://localhost:8005/v1"
    api_key_env: "VLLM_API_KEY"
    temperature: 0.0
    max_tokens: 8192
    max_concurrent: 4
